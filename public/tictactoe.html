<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/tictactoe.css" />
</head>
<body>

  <!-- ═══════════════════════════════ LOBBY ══════════════════════════════════ -->
  <div id="screen-lobby" class="screen">
    <div class="card">
      <div class="logo">❌⭕</div>
      <h1>Tic Tac Toe</h1>
      <p class="tagline">Classic 3×3 battle — be first to line up three!</p>

      <div class="field">
        <label for="player-name">Your Name</label>
        <input id="player-name" type="text" placeholder="Enter your name…" maxlength="20" autocomplete="off" />
      </div>

      <div class="btn-row">
        <button id="btn-vs-ai"        class="btn btn-accent">🤖 vs Computer</button>
        <button id="btn-create-online" class="btn btn-primary">🌐 Create Game</button>
      </div>

      <div class="divider">or join an existing game</div>

      <div class="field-inline">
        <input id="room-code-input" type="text" placeholder="Room code…" maxlength="6" autocomplete="off" />
        <button id="btn-join" class="btn btn-outline">Join</button>
      </div>

      <p id="lobby-error" class="error-msg hidden"></p>

      <div class="divider">other games</div>
      <a href="/" class="btn btn-outline" style="display:block;text-decoration:none;">🌀 Portal Quest</a>
    </div>
  </div>

  <!-- ═══════════════════════════════ WAITING ════════════════════════════════ -->
  <div id="screen-waiting" class="screen hidden">
    <div class="card">
      <h2>Waiting for opponent…</h2>
      <div class="room-code-box">
        Room code: <strong id="room-code-display">——</strong>
        <button class="btn-icon" id="btn-copy-code" title="Copy code">📋</button>
      </div>
      <ul id="waiting-list" class="player-list"></ul>
      <p class="hint">Share the code with a friend to start</p>
      <p id="waiting-error" class="error-msg hidden"></p>
    </div>
  </div>

  <!-- ═══════════════════════════════ GAME ══════════════════════════════════ -->
  <div id="screen-game" class="screen hidden">
    <div class="ttt-game-wrap">
      <div class="ttt-header">
        <h1>Tic Tac Toe</h1>
        <div id="ttt-status" class="ttt-status">—</div>
      </div>

      <div class="ttt-board" id="ttt-board">
        <button class="ttt-cell" data-idx="0"></button>
        <button class="ttt-cell" data-idx="1"></button>
        <button class="ttt-cell" data-idx="2"></button>
        <button class="ttt-cell" data-idx="3"></button>
        <button class="ttt-cell" data-idx="4"></button>
        <button class="ttt-cell" data-idx="5"></button>
        <button class="ttt-cell" data-idx="6"></button>
        <button class="ttt-cell" data-idx="7"></button>
        <button class="ttt-cell" data-idx="8"></button>
      </div>

      <div class="ttt-score-row" id="ttt-score-row"></div>
    </div>
  </div>

  <!-- ══════════════════════════════ GAME OVER ═══════════════════════════════ -->
  <div id="screen-gameover" class="screen hidden">
    <div class="card gameover-card">
      <div class="trophy" id="gameover-icon">🏆</div>
      <h1>Game Over!</h1>
      <h2 id="winner-label">—</h2>
      <button id="btn-play-again" class="btn btn-primary">Play Again</button>
      <a href="/tictactoe.html" class="btn btn-outline" style="display:block;text-decoration:none;margin-top:10px;">New Game</a>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/tictactoe.js"></script>
</body>
</html>
